<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator | CodeAlpha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95 60%, #0f172a);
    font-family: "Segoe UI", system-ui, sans-serif; padding: 16px;
  }
  .calculator {
    width: 100%; max-width: 340px; padding: 20px; border-radius: 24px;
    background: rgba(255,255,255,.08); backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
  }
  .display {
    background: rgba(0,0,0,.35); border-radius: 16px; padding: 14px 18px;
    margin-bottom: 18px; text-align: right; min-height: 96px;
    display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  }
  .history { color: #a5b4fc; font-size: 1rem; min-height: 1.3em; word-break: break-all; }
  .current { color: #fff; font-size: 2.6rem; font-weight: 300; word-break: break-all; line-height: 1.1; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button {
    height: 62px; border: none; border-radius: 16px; font-size: 1.35rem; cursor: pointer;
    color: #fff; background: rgba(255,255,255,.12); transition: transform .12s, background .2s, box-shadow .2s;
  }
  button:hover { background: rgba(255,255,255,.22); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  button:active { transform: scale(.93); }
  .op { background: #7c3aed; }
  .op:hover { background: #8b5cf6; }
  .fn { background: rgba(244,114,182,.35); }
  .fn:hover { background: rgba(244,114,182,.55); }
  .eq { background: #ec4899; }
  .eq:hover { background: #f472b6; }
  .zero { grid-column: span 2; }
  .error .current { color: #fca5a5; font-size: 1.8rem; }
</style>
</head>
<body>
<div class="calculator" id="calc">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="delete">⌫</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="÷">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="×">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="−">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
  const currentEl = document.getElementById("current");
  const historyEl = document.getElementById("history");
  const calcEl = document.getElementById("calc");

  let current = "0";       // number being typed
  let previous = null;     // stored first operand
  let operator = null;     // pending operator
  let overwrite = false;   // start fresh after equals

  const fmt = (n) => {
    if (!isFinite(n)) return "Error";
    return String(parseFloat(n.toPrecision(12)));
  };

  function update() {
    currentEl.textContent = current;
    historyEl.textContent = previous !== null && operator ? `${previous} ${operator}` : "";
    currentEl.style.fontSize = current.length > 11 ? "1.6rem" : current.length > 8 ? "2rem" : "";
  }

  function showError(msg = "Cannot divide by 0") {
    calcEl.classList.add("error");
    current = msg; previous = null; operator = null; overwrite = true;
    update();
  }

  function clearError() {
    if (calcEl.classList.contains("error")) {
      calcEl.classList.remove("error");
      current = "0";
    }
  }

  function inputNumber(n) {
    clearError();
    if (overwrite) { current = "0"; overwrite = false; }
    if (current === "0") current = n;
    else if (current.replace(/[-.]/g, "").length < 15) current += n;
    update();
  }

  function inputDecimal() {
    clearError();
    if (overwrite) { current = "0"; overwrite = false; }
    if (!current.includes(".")) current += ".";
    update();
  }

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    switch (op) {
      case "+": return a + b;
      case "−": return a - b;
      case "×": return a * b;
      case "÷": return b === 0 ? NaN : a / b;
    }
  }

  function chooseOperator(op) {
    clearError();
    if (operator && !overwrite) {
      const result = compute(previous, current, operator);
      if (isNaN(result)) return showError();
      previous = fmt(result);
      current = previous;
    } else {
      previous = current;
    }
    operator = op;
    overwrite = true;
    update();
  }

  function equals() {
    if (!operator || previous === null) return;
    const result = compute(previous, current, operator);
    if (isNaN(result)) return showError();
    historyEl.textContent = `${previous} ${operator} ${current} =`;
    current = fmt(result);
    previous = null; operator = null; overwrite = true;
    currentEl.textContent = current;
  }

  function clearAll() {
    calcEl.classList.remove("error");
    current = "0"; previous = null; operator = null; overwrite = false;
    update();
  }

  function del() {
    clearError();
    if (overwrite) return;
    current = current.length > 1 ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
    update();
  }

  function percent() {
    clearError();
    current = fmt(parseFloat(current) / 100);
    update();
  }

  document.querySelector(".keys").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.num !== undefined) inputNumber(b.dataset.num);
    else if (b.dataset.op) chooseOperator(b.dataset.op);
    else switch (b.dataset.action) {
      case "decimal": inputDecimal(); break;
      case "equals": equals(); break;
      case "clear": clearAll(); break;
      case "delete": del(); break;
      case "percent": percent(); break;
    }
  });

  // Keyboard support
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) inputNumber(k);
    else if (k === ".") inputDecimal();
    else if (k === "+") chooseOperator("+");
    else if (k === "-") chooseOperator("−");
    else if (k === "*" || k.toLowerCase() === "x") chooseOperator("×");
    else if (k === "/") { e.preventDefault(); chooseOperator("÷"); }
    else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
    else if (k === "Backspace") del();
    else if (k === "Escape" || k === "Delete") clearAll();
    else if (k === "%") percent();
  });

  update();
</script>
</body>
</html>
